auto-install-peers: false

shamefully-hoist: true

catalogMode: prefer

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@nuxt/kit'
  - '@nuxt/nitro-server'
  - '@nuxt/schema'
  - '@nuxt/vite-builder'
  - nuxt

shellEmulator: true

strict-peer-dependencies: false

trustPolicy: no-downgrade

overrides:
  chokidar: ^5.0.0
  magicast: ^0.5.4
  semver: ^7.8.5

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@iconify-json/lucide': ^1.2.123
  '@nuxt/eslint': ^1.17.0
  '@nuxt/ui': ^4.10.0
  '@vueuse/core': ^14.4.0
  '@vueuse/nuxt': ^14.4.0
  eslint: ^10.8.1
  eslint-plugin-format: ^2.0.1
  lint-staged: ^17.3.0
  nuxt: ^4.5.0
  simple-git-hooks: ^2.13.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vue: ^3.5.41
  vue-router: ^5.2.0
  vue-tsc: ^3.3.10

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - simple-git-hooks

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
