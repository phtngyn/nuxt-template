auto-install-peers: false

shamefully-hoist: true

catalogMode: prefer

cleanupUnusedCatalogs: true

shellEmulator: true

strict-peer-dependencies: false

trustPolicy: no-downgrade

overrides:
  chokidar: ^5.0.0
  eslint: ^10.4.1
  magicast: ^0.5.3
  semver: ^7.8.3
  typescript: ^6.0.3
  vite: ^8.0.16

catalog:
  '@antfu/eslint-config': ^9.0.0
  '@nuxt/eslint': ^1.15.2
  '@nuxt/ui': ^4.8.2
  '@vueuse/core': ^14.3.0
  '@vueuse/nuxt': ^14.3.0
  eslint: ^10.4.1
  eslint-plugin-format: ^2.0.1
  nano-staged: ^1.0.2
  nuxt: ^4.4.5
  simple-git-hooks: ^2.13.1
  typescript: ^6.0.3
  vue: ^3.5.35
  vue-router: ^5.1.0
  vue-tsc: ^3.3.4
  zod: ^4.4.3

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - simple-git-hooks

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
